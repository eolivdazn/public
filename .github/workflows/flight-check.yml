name: Flight check

# Compares the upcoming flights in the trip markdown files with the airline's published
# timetable. The run fails when a flight changed or disappeared, and GitHub emails the failure.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check flights against the timetable
        run: npm run check:flights
