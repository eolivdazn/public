name: Azure Static Web Apps CI/CD.

# Prod deploys only from main. Other branches deploy to the stage app instead
# (azure-static-web-apps-stage.yml) — PR preview environments of this app were removed
# because they ran branch code against prod data.
on:
  push:
    branches:
      - main
  # Daily rebuild, so the flight schedule check on the trip pages stays current.
  schedule:
    - cron: "30 6 * * *"

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Run integration tests
        run: npm run test:integration

      - name: Run API integration tests
        run: cd api && npm ci && npm run test:integration

      - name: Build static pages and dashboard data
        run: npm run build:site

      # Publishes the flight schedule check the trip pages show (assets/flight-status.js).
      # --report-only: a changed flight is shown on the page, it must not block the deploy.
      - name: Check flights against the timetable
        run: npm run check:flights -- --report-only --output site/flight-status.json

      - name: Build React dashboard
        run: npm run build:dashboard

      - name: Build quick-expense-widget
        run: npm run build:quick-expense-widget

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_STONE_0B0565103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "site" # Prebuilt static files root
          api_location: "api" # Api source code path - optional
          output_location: "" # Not used when skip_app_build is true
          skip_app_build: true
          ###### End of Repository/Build Configurations ######
