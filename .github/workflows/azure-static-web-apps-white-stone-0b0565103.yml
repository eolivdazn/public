name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build static site from Markdown
        run: |
          set -euo pipefail
          mkdir -p site

          shopt -s nullglob
          md_files=()
          for md in *.md; do
            [ -f "$md" ] || continue
            [ "$md" = "README.md" ] && continue
            md_files+=("$md")
          done

          if [ ${#md_files[@]} -eq 0 ]; then
            echo "No markdown files found at repo root (excluding README.md)."
            exit 1
          fi

          for md in "${md_files[@]}"; do
            base="${md%.md}"
            pandoc "$md" -f markdown -t html -s -o "site/${base}.html"
          done

          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Travel Pages</title>
          </head>
          <body>
            <h1>Travel Pages</h1>
            <ul>
          HTML

            for md in "${md_files[@]}"; do
              base="${md%.md}"
              printf '      <li><a href="%s.html">%s</a></li>\n' "$base" "$base"
            done

            cat <<'HTML'
            </ul>
          </body>
          </html>
          HTML
          } > site/index.html

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_STONE_0B0565103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "site" # Built app content directory - optional
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_STONE_0B0565103 }}
          action: "close"
          app_location: "/"
