name: Azure Static Web Apps CI/CD (stage)

# Deploys any branch except main to the "stage" named preview environment of the prod Static Web
# App (swa-public-pages) — see README "Staging". Stage inherits prod's API settings, so it reads
# and writes the same data as prod. Prod deploys only from main, via
# azure-static-web-apps-white-stone-0b0565103.yml.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# Stage holds one branch at a time: a newer push replaces a deploy that is still running.
concurrency:
  group: stage-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy to Stage
    env:
      # Optional: absolute URLs in OG tags and share cards point at the stage host when the
      # STAGE_SITE_ORIGIN repository variable is set; unset, they use the prod host.
      SITE_ORIGIN: ${{ vars.STAGE_SITE_ORIGIN }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # SITE_ORIGIN is cleared here: the integration tests assert the default (prod) origin.
      - name: Run integration tests
        run: npm run test:integration
        env:
          SITE_ORIGIN: ""

      - name: Run API integration tests
        run: cd api && npm ci && npm run test:integration

      - name: Build static pages and dashboard data
        run: npm run build:site

      - name: Build React dashboard
        run: npm run build:dashboard

      - name: Build quick-expense-widget
        run: npm run build:quick-expense-widget

      # Stage shares prod's deployment token. deployment_environment is what keeps this deploy
      # out of production: never remove it or leave it empty, or the branch goes to prod.
      # This check fails the run before deploying if that line is ever edited away.
      - name: Guard against deploying a branch to production
        run: |
          grep -qE '^\s+deployment_environment: "stage"$' .github/workflows/azure-static-web-apps-stage.yml \
            || { echo "::error::deployment_environment: \"stage\" is missing — refusing to deploy with the prod token."; exit 1; }

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_STONE_0B0565103 }}
          deployment_environment: "stage"
          action: "upload"
          app_location: "site" # Prebuilt static files root
          api_location: "api" # Api source code path
          output_location: "" # Not used when skip_app_build is true
          skip_app_build: true

      - name: Summary
        run: |
          {
            echo "### Deployed to stage"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- URL: ${STAGE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STAGE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
