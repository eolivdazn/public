name: Deploy Markdown files to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      # 1️⃣ Clonar repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Instalar Pandoc para converter Markdown
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # 3️⃣ Converter todos os arquivos Markdown para HTML
      - name: Convert Markdown to HTML
        run: |
          set -euo pipefail
          mkdir -p site

          # Usa Thailand.md como home quando existir; caso contrario usa o primeiro .md
          if [ -f "Thailand.md" ]; then
            home_md="Thailand.md"
          else
            home_md="$(find . -maxdepth 1 -type f -name '*.md' | head -n 1)"
          fi

          if [ -z "${home_md:-}" ]; then
            echo "No markdown files found at repo root."
            exit 1
          fi

          pandoc "$home_md" -f markdown -t html -s -o site/index.html

          for md in *.md; do
            [ -f "$md" ] || continue
            base="${md%.md}"
            pandoc "$md" -f markdown -t html -s -o "site/${base}.html"
          done

      # 4️⃣ Upload do artifact para GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site  # index.html está agora no root do artifact

      # 5️⃣ Deploy do artifact para GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
