name: Deploy Markdown files to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      # 1️⃣ Clonar repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Instalar Pandoc para converter Markdown
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # 3️⃣ Converter todos os arquivos Markdown para HTML e gerar um indice
      - name: Convert Markdown to HTML
        run: |
          set -euo pipefail
          mkdir -p site

          shopt -s nullglob
          md_files=()
          for md in *.md; do
            [ -f "$md" ] || continue
            [ "$md" = "README.md" ] && continue
            md_files+=("$md")
          done

          if [ ${#md_files[@]} -eq 0 ]; then
            echo "No markdown files found at repo root (excluding README.md)."
            exit 1
          fi

          # Converte cada markdown para uma pagina html.
          for md in "${md_files[@]}"; do
            base="${md%.md}"
            pandoc "$md" -f markdown -t html -s -o "site/${base}.html"
          done

          # Gera index.html com links para todas as paginas criadas.
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Travel Pages</title>
          </head>
          <body>
            <h1>Travel Pages</h1>
            <ul>
          HTML

            for md in "${md_files[@]}"; do
              base="${md%.md}"
              printf '      <li><a href="%s.html">%s</a></li>\n' "$base" "$base"
            done

            cat <<'HTML'
            </ul>
          </body>
          </html>
          HTML
          } > site/index.html

      # 4️⃣ Upload do artifact para GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site  # index.html está agora no root do artifact

      # 5️⃣ Deploy do artifact para GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
