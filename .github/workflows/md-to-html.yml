name: Deploy Markdown files to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      # 1️⃣ Clonar repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 2️⃣ Instalar Pandoc para converter Markdown
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # 3️⃣ Build trip pages + dashboard dataset
      - name: Build site content
        run: npm run build:site

      # 4️⃣ Build React dashboard
      - name: Build dashboard
        run: npm run build:dashboard

      # 5️⃣ Upload do artifact para GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site  # index.html está agora no root do artifact

      # 6️⃣ Deploy do artifact para GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
